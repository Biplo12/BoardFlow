name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # nanoid 6 refuses to install below Node 22, and the v4 actions are
      # pinned to a Node the runners have deprecated.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

      - run: yarn build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          LIVEBLOCKS_SECRET_KEY: sk_dummy_for_build
